name: Kulturkalender-job (søgbare sider, notifikationer, hold Supabase vågen)

on:
  schedule:
    - cron: '17 * * * *'      # hver time
  workflow_dispatch:           # kan køres manuelt under Actions → Run workflow

permissions:
  contents: write              # så de genererede sider kan gemmes i repoet
  actions: write               # så jobbet kan tænde sig selv igen, hvis GitHub har slået det fra

concurrency:
  group: kk-job
  cancel-in-progress: false

jobs:
  job:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      - run: npm ci --prefix scripts
      - name: Kør job
        run: node scripts/kk-job.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Gem genererede sider
        run: |
          git config user.name "kk-job"
          git config user.email "kk-job@users.noreply.github.com"
          git add -A d index.html sitemap.xml robots.txt
          git diff --cached --quiet || (git commit -m "Opdater arrangementssider" && git push)
      - name: Sørg for at timejobbet forbliver tændt
        run: gh workflow enable kk-job.yml || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
